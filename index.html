<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Margalla Riders: find bikers in Islamabad and Rawalpindi who are free on your dates, browse northern routes and plan group tours.">
<meta property="og:title" content="Margalla Riders">
<meta property="og:description" content="Find ride partners in Islamabad, browse routes from Murree to Khunjerab, and plan group bike tours.">
<meta name="theme-color" content="#0B0D0E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF6B1A'/%3E%3Ccircle cx='9' cy='21' r='5' fill='none' stroke='%23170800' stroke-width='2.5'/%3E%3Ccircle cx='23' cy='21' r='5' fill='none' stroke='%23170800' stroke-width='2.5'/%3E%3Cpath d='M9 21l5-9h6l3 9' fill='none' stroke='%23170800' stroke-width='2.5' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body><title>Margalla Riders</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Saira:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: night-ride instrument look. Sticky top bar (bottom tab bar on phones), hero with a winding road and a gauge cluster, cards like spec sheets on asphalt. Deliberately single dark theme. */
:root{
  --bg:#0B0D0E; --surface:#15181A; --sunk:#1C2023; --raise:#23282C; --ink:#ECEFF1; --muted:#8D969C; --line:#2A3035;
  --sign:#FF6B1A; --sign-ink:#170800; --amber:#F5C518; --amber-soft:#2E2608; --ok:#3DDC97; --danger:#FF5A4E;
  --display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Saira",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:14px; color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1140px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em;font-weight:800}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
::selection{background:var(--sign);color:var(--sign-ink)}

/* top bar + tabs */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--sign);color:var(--sign-ink);display:grid;place-items:center}
.brand .logo svg{width:22px;height:22px}
.brand small{display:block;font-family:var(--body);font-size:10.5px;letter-spacing:.18em;color:var(--muted);font-weight:600;line-height:1}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs button{display:flex;align-items:center;gap:7px;background:none;border:0;color:var(--muted);padding:8px 14px;border-radius:99px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.tabs button svg{width:18px;height:18px;flex:none}
.tabs button:hover{color:var(--ink);background:var(--sunk)}
.tabs button[aria-selected="true"]{background:var(--sign);color:var(--sign-ink)}
@media (max-width:760px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;margin:0;justify-content:space-around;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabs button{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;flex:1;border-radius:12px}
  .tabs button svg{width:22px;height:22px}
  .tabs button[aria-selected="true"]{background:none;color:var(--sign)}
  main .wrap{padding-bottom:110px!important}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))!important}
  .savebar{bottom:calc(64px + env(safe-area-inset-bottom,0px))!important}
}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);
  background:radial-gradient(120% 90% at 85% 10%,color-mix(in srgb,var(--sign) 22%,transparent),transparent 60%),var(--bg)}
.hero .wrap{position:relative;z-index:1;padding-block:34px 30px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:end}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr;padding-block:24px}}
.kicker{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.kicker::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}
.hero h1{font-size:clamp(38px,6.4vw,68px);line-height:.95;margin-top:12px;text-transform:uppercase;letter-spacing:-.005em}
.hero h1 em{font-style:normal;color:var(--sign)}
.hero p{margin:12px 0 0;max-width:52ch;color:var(--muted);font-size:16px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.hero{min-height:clamp(460px,52vw,640px);display:flex;flex-direction:column;justify-content:flex-end;background:#0B1220}
.hero .wrap{width:100%}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.scrim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(6,8,10,.88) 0%,rgba(6,8,10,.55) 42%,rgba(6,8,10,0) 70%),linear-gradient(0deg,rgba(11,13,14,.95) 0%,rgba(11,13,14,0) 38%)}
@media (max-width:860px){
  .hero{min-height:0;background:var(--bg)}
  #scene{position:relative;height:clamp(230px,62vw,340px)}
  .scrim{inset:auto 0 auto 0;top:calc(clamp(230px,62vw,340px) - 70px);height:72px;background:linear-gradient(180deg,rgba(11,13,14,0),var(--bg))}
  .hero .wrap{margin-top:-24px}
}
.hero h1,.hero p,.kicker{text-shadow:0 2px 18px rgba(0,0,0,.6)}
.hero p{color:#C9D1D6}
.vbar{position:absolute;z-index:2;top:14px;right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:center}
.vcap{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);padding:6px 10px;border-radius:99px;color:#E9EEF1}
.vcap i{width:8px;height:8px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 3px rgba(255,90,78,.25)}
.vctl{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(6px)}
.vctl svg{width:16px;height:16px}
@media (max-width:520px){.vcap{display:none}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:480px){.stats{grid-template-columns:1fr 1fr}.stats .gauge{grid-column:1/-1}}
.tile{background:color-mix(in srgb,var(--surface) 85%,transparent);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.g-l{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.gauge{flex-direction:row;align-items:center;gap:12px}
.ring{--p:0;flex:none;width:72px;height:72px;border-radius:50%;background:conic-gradient(from 225deg,var(--sign) calc(var(--p)*.75%),var(--raise) 0 75%,transparent 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--surface)}
.ring b{position:relative;font-family:var(--mono);font-size:22px;line-height:1}
.ring span{position:absolute;bottom:4px;font-family:var(--mono);font-size:9.5px;color:var(--muted)}
.odo{display:flex;gap:3px}
.odo i{font-style:normal;font-family:var(--mono);font-weight:700;font-size:24px;line-height:1;background:#000;color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:6px 5px;box-shadow:inset 0 -10px 12px -8px rgba(255,255,255,.08)}
.odo i:last-child{color:var(--sign)}

main .wrap{padding-block:22px 60px}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 45%,transparent);padding:10px 14px;border-radius:12px;margin-bottom:16px;font-size:14px}
.banner b{font-weight:600;color:var(--amber)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--sunk);padding:9px 16px;border-radius:99px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary,.btn.amber{background:var(--sign);color:var(--sign-ink);border-color:var(--sign);font-weight:700}
.btn.primary:hover,.btn.amber:hover{filter:brightness(1.08)}
.btn.ghost{background:none}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=tel],input[type=number],input[type=date],select,textarea{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--sign);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--sign) 25%,transparent)}
textarea{resize:vertical;min-height:80px}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 60%,transparent);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.private{display:flex;gap:10px;align-items:flex-start;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px}
.private svg{flex:none;width:18px;height:18px;margin-top:1px;color:var(--amber)}
.req{color:var(--danger)}
.legal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.ticks{display:grid;gap:8px}
.ticks label{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.ticks input{margin-top:4px;flex:none;accent-color:var(--sign)}
.adm{border-top:1px solid var(--line);padding-top:12px}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;align-items:end;margin-bottom:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
@media (max-width:760px){.filters{grid-template-columns:1fr 1fr}.filters .field:first-child{grid-column:1/-1}}
.check{display:flex;align-items:center;gap:8px;font-size:14px;padding:9px 0;white-space:nowrap;cursor:pointer}
.check input{accent-color:var(--sign)}

/* rider cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:12px;min-width:0;overflow:hidden;padding:0 16px 16px}
.card.matched{border-color:color-mix(in srgb,var(--sign) 55%,var(--line))}
.cover{margin:0 -16px;height:64px;position:relative;display:flex;justify-content:space-between;align-items:flex-start;padding:10px 12px;
  background:repeating-linear-gradient(115deg,transparent 0 10px,rgba(255,255,255,.025) 10px 20px),linear-gradient(135deg,var(--raise),var(--sunk))}
.card.matched .cover{background:repeating-linear-gradient(115deg,transparent 0 10px,rgba(0,0,0,.06) 10px 20px),linear-gradient(135deg,color-mix(in srgb,var(--sign) 55%,var(--raise)),var(--raise))}
.cover .type{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;background:rgba(0,0,0,.45);padding:3px 8px;border-radius:99px}
.match-pill{font-size:11.5px;font-weight:700;background:var(--ink);color:var(--bg);padding:3px 9px;border-radius:99px}
.who{display:flex;gap:12px;align-items:flex-end;min-width:0}
.card .who{margin-top:-34px;position:relative}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px;color:#fff;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.card .who .av{width:68px;height:68px;font-size:26px;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line)}
.card.matched .who .av{box-shadow:0 0 0 2px var(--sign)}
.photo-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.photo-row .av{width:88px;height:88px;font-size:32px;box-shadow:0 0 0 2px var(--sign);border:3px solid var(--surface)}
.dlg .who .av{width:64px;height:64px;font-size:24px}
.who h3{font-size:22px;line-height:1.05;overflow-wrap:anywhere}
.who small{color:var(--muted);font-size:13px}
.plate{display:flex;align-items:stretch;gap:12px;background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:14px}
.plate .cc{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;font-family:var(--mono);font-weight:700;font-size:22px;line-height:1;color:var(--sign);padding-right:12px;border-right:1px dashed var(--line);white-space:nowrap}
.plate .cc::after{content:"CC";font-size:9.5px;letter-spacing:.14em;color:var(--muted);margin-top:3px}
.plate .bk{min-width:0;display:flex;flex-direction:column;justify-content:center}
.plate .bk b{display:block;font-weight:600;overflow-wrap:anywhere}
.plate .bk span{color:var(--muted);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:3px 10px;border-radius:99px;background:var(--sunk);color:var(--ink);white-space:nowrap;border:1px solid transparent}
.chip.date{font-family:var(--mono);font-size:11.5px}
.chip.shared{background:color-mix(in srgb,var(--sign) 18%,transparent);border-color:var(--sign);color:var(--ink)}
.chip.pick{cursor:pointer;border:1px solid var(--line);background:var(--sunk)}
.chip.pick[aria-pressed="true"]{background:var(--sign);color:var(--sign-ink);border-color:var(--sign);font-weight:600}
.match{font-size:12px;font-weight:600;color:var(--ok);display:flex;align-items:center;gap:6px}
.match::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.card .actions{display:flex;gap:8px;margin-top:auto}
.card .actions .btn{flex:1}
.sample-tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);border:1px solid var(--amber);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle}

/* routes */
.rcard{padding-top:0}
.rhead{display:block;margin:0 -16px;padding:14px 0 0;background:linear-gradient(180deg,var(--sunk),transparent);border:0;cursor:pointer;position:relative;width:calc(100% + 32px)}
.rhead .elev{display:block;width:100%;height:76px}
.rdays{position:absolute;top:10px;left:12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;background:rgba(0,0,0,.5);padding:3px 8px;border-radius:99px}
.mini-elev{margin:0 0 8px;width:100%;padding:6px 0 0;border-radius:10px;overflow:hidden}
.mini-elev .elev{height:56px}
.ride-rt{margin:0 0 12px}
.elev-wrap{background:var(--sunk);border-radius:12px;padding:8px 6px 2px}
.elev-wrap .elev{display:block;width:100%;height:auto}
.rstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.rstats div{background:var(--sunk);border-radius:10px;padding:8px 10px;min-width:0}
.rstats b{display:block;font-family:var(--mono);font-size:16px;line-height:1.2;white-space:nowrap}
.rstats span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
@media (max-width:420px){.rstats{grid-template-columns:1fr 1fr}}
.diff{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 9px;border-radius:99px;border:1px solid}
.d-easy{color:var(--ok);border-color:var(--ok)}
.d-moderate{color:var(--amber);border-color:var(--amber)}
.d-hard{color:var(--danger);border-color:var(--danger)}
.surf{display:flex;height:8px;border-radius:99px;overflow:hidden;gap:2px}
.surf i{display:block}
.s-paved{background:#8A959C}.s-broken{background:var(--amber)}.s-gravel{background:#B5835A}.s-dirt{background:var(--sign)}
.stages,.stops{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.stages li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--sunk);border-radius:10px;padding:8px 12px}
.stages b{font-family:var(--display);color:var(--sign);font-size:16px}
.stages em,.stops em{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.stops li{display:flex;justify-content:space-between;gap:10px;padding:0 0 6px 18px;border-bottom:1px dashed var(--line);position:relative}
.stops li::before{content:"";position:absolute;left:2px;top:7px;width:8px;height:8px;border-radius:50%;border:2px solid var(--sign)}
.stops li:last-child::before{background:var(--sign)}
.hls{display:grid;gap:8px}
.hl{display:flex;gap:10px;align-items:flex-start;background:var(--sunk);border-radius:10px;padding:10px 12px;border-left:3px solid var(--muted)}
.hl p{margin:2px 0;font-size:14px}
.hl-t{flex:none;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);width:72px;padding-top:2px}
.hl-fuel{border-left-color:var(--amber)}.hl-food{border-left-color:#B5835A}.hl-view{border-left-color:var(--ok)}.hl-mechanic{border-left-color:#8A959C}.hl-stay{border-left-color:#7C9CFF}.hl-check{border-left-color:var(--ink)}
.hl-hazard{border-left-color:var(--danger)}.hl-hazard .hl-t{color:var(--danger)}
.hl-a{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.vote{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 9px;font-family:var(--mono);font-size:12px;cursor:pointer}
.vote[aria-pressed="true"]{background:var(--sign);color:var(--sign-ink);border-color:var(--sign)}
.hlf{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-top:10px}
.hlf #h-note{grid-column:1/-1}.hlf .btn{grid-column:1/-1;justify-self:start}
/* empty */
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:38px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);
  background:repeating-linear-gradient(90deg,transparent 0 46px,color-mix(in srgb,var(--amber) 10%,transparent) 46px 70px) center 100%/100% 3px no-repeat,var(--surface)}
.empty h3{color:var(--ink);font-size:26px;text-transform:uppercase}
.empty p{margin:0;max-width:48ch}

/* calendar */
.cal-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.cal-layout{grid-template-columns:1fr}}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-head h2{font-size:26px;flex:1;text-transform:uppercase}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dow{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0}
.day{aspect-ratio:1/1;max-width:100%;border:1px solid transparent;border-radius:10px;background:var(--sunk);display:flex;flex-direction:column;justify-content:space-between;padding:5px 6px;cursor:pointer;text-align:left;font-variant-numeric:tabular-nums;position:relative;min-width:0}
.day:hover:not(:disabled){border-color:var(--muted)}
.day .n{font-weight:600;font-size:14px;font-family:var(--mono)}
.day .c{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden}
.day.has{background:color-mix(in srgb,var(--sign) calc(var(--heat) * 1%),var(--sunk))}
.day.hot .n,.day.hot .c{color:var(--sign-ink)}
.day.mine::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 2px var(--bg)}
.day.sel{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.day.past,.day.out{opacity:.3;cursor:default}
.day.today .n{text-decoration:underline;text-decoration-color:var(--amber);text-underline-offset:3px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.side h2{font-size:30px;text-transform:uppercase}
.side .sub{color:var(--muted);margin:2px 0 12px}
.mini{display:flex;flex-direction:column;gap:8px}
.mini-item{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 11px;cursor:pointer;text-align:left;width:100%}
.mini-item:hover{border-color:var(--sign)}
.mini-item .av{width:38px;height:38px;font-size:15px}
.mini-item div{min-width:0;flex:1}
.mini-item b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-item span{font-size:12.5px;color:var(--muted)}

/* rides */
.ride{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative;overflow:hidden}
.ride::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sign)}
.dateblock{width:76px;text-align:center;border-radius:12px;overflow:hidden;background:var(--sunk);align-self:start}
.dateblock .m{background:var(--sign);color:var(--sign-ink);font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.14em;padding:3px 0}
.dateblock .d{font-family:var(--display);font-weight:800;font-size:36px;line-height:1.1}
.dateblock .w{font-size:11.5px;color:var(--muted);padding-bottom:6px;text-transform:uppercase;letter-spacing:.1em}
.ride h3{font-size:26px;text-transform:uppercase;line-height:1.05}
.ride .meta{color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:4px 14px;margin:4px 0 10px}
.ride p{margin:0 0 10px}
.route{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;background:var(--sunk);border-radius:10px;padding:10px 12px;margin:0 0 12px}
.route .pin{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:6px;white-space:nowrap;min-width:0}
.route .pin::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);flex:none}
.route .pin.end::before{background:var(--sign);border-color:var(--sign)}
.route .pin.end{overflow:hidden;text-overflow:ellipsis}
.route .line{position:relative;height:18px;display:flex;align-items:center;justify-content:center}
.route .line::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed var(--amber);opacity:.8}
.route .line span{position:relative;background:var(--sunk);padding:0 8px;font-family:var(--mono);font-size:11.5px;color:var(--amber);white-space:nowrap}
.list{display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;align-items:end;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sec-head h2{font-size:32px;flex:1;text-transform:uppercase}

/* profile form */
.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:860px){.form{grid-template-columns:1fr}}
fieldset{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:18px;margin:0;display:grid;gap:14px;min-width:0}
legend{font-family:var(--display);font-weight:800;font-size:20px;padding:0 8px;text-transform:uppercase;letter-spacing:.03em;color:var(--sign)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1.2fr 1.2fr .8fr;gap:10px}
@media (max-width:480px){.three{grid-template-columns:1fr 1fr}.three .field:last-child{grid-column:1/-1}}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.savebar{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%);grid-column:1/-1;z-index:5}

/* modal */
dialog{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(0,0,0,.7);backdrop-filter:blur(3px)}
.dlg{padding:22px;display:flex;flex-direction:column;gap:14px}
.dlg h2{font-size:30px;text-transform:uppercase;line-height:1}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.phone{font-family:var(--mono);user-select:all}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;z-index:50;max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:no-preference){
  .card,.ride,.mini-item{transition:border-color .15s,transform .15s}.card:hover{transform:translateY(-2px);border-color:var(--muted)}
  .road .dash{animation:drive 2.4s linear infinite}
  @keyframes drive{to{stroke-dashoffset:-48}}
}

  const past=S.rides.filter(r=>r.date<TODAY).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,20);

function readForm(){const d=S.draft;const v=id=>$("#"+id).value;
  d.name=v("p-name").trim();d.area=v("p-area");d.years=v("p-years");d.phone=v("p-phone").trim();d.bio=v("p-bio").trim();
  d.bike={make:v("b-make").trim(),model:v("b-model").trim(),cc:v("b-cc"),type:v("b-type")};d.gender=v("p-gender");d.level=v("p-level");

    regNo:v("v-reg").trim().toUpperCase(),regProv:v("v-regprov"),ecName:v("v-ecn").trim(),ecPhone:v("v-ecp").trim(),helmet:c("v-helmet"),insured:c("v-ins"),papers:c("v-papers"),agree:c("v-agree")});}
function checkLegal(){const d=S.draft,x=S.vdraft;
  if(S.editId){
    for(const[id,val,msg]of[["p-name",d.name,"Add the rider's name"],["p-gender",d.gender,"Choose the rider's gender"],["b-make",d.bike.make,"Add the bike's make"],["b-model",d.bike.model,"Add the bike's model"]])if(!val)return[id,msg];
    if(x.cnic&&!CNIC_RE.test(x.cnic))return["v-cnic","CNIC must be 13 digits in the form 12345-1234567-1"];
    if(x.dob&&ageOn(x.dob)<18)return["v-dob","Riders must be 18 or older to be listed"];
    if(x.licExp&&x.licExp<TODAY)return["v-licexp","That licence has expired"];
    return null}
  const need=[["p-name",d.name,"Add your name"],["p-gender",d.gender,"Choose your gender"],["b-make",d.bike.make,"Add your bike's make"],["b-model",d.bike.model,"Add your bike's model"],
    ["v-legal",x.legalName,"Add your full name as it appears on your CNIC"]];
  for(const[id,val,msg]of need)if(!val)return[id,msg];
  if(!CNIC_RE.test(x.cnic))return["v-cnic","CNIC must be 13 digits in the form 12345-1234567-1"];
  if(!x.dob)return["v-dob","Add your date of birth"];
  if(ageOn(x.dob)<18)return["v-dob","Riders must be 18 or older to list a profile"];
  if(!x.blood)return["v-blood","Choose your blood group, or “Don't know”"];
  if(!x.licNo)return["v-lic","Add your driving licence number"];
  if(!x.licExp)return["v-licexp","Add your licence expiry date"];
  if(x.licExp<TODAY)return["v-licexp","Your licence has expired. Renew it before joining rides"];
  if(!x.licCat)return["v-liccat","Choose your licence category"];
  if(!x.regNo)return["v-reg","Add your bike's registration number"];
  if(!x.regProv)return["v-regprov","Choose where your bike is registered"];
  if(!x.ecName)return["v-ecn","Add an emergency contact name"];
  if(!x.ecPhone)return["v-ecp","Add an emergency contact phone number"];
  if(!x.helmet)return["v-helmet","Confirm you wear a helmet"];
  if(!x.papers)return["v-papers","Confirm your registration papers and token tax"];
  if(!x.agree)return["v-agree","Accept the rider agreement to publish"];
  return null}

let gid=0;
function elevSvg(rt,big){
  const w=big?640:320,h=big?170:70,pl=big?40:2,pb=big?20:2,pt=big?18:4,pr=big?8:2;const p=rt.wp;const mk=rt.km;const top=Math.max(1500,Math.ceil(rt.top[2]*1.15/500)*500);
  const x=k=>pl+(k/mk)*(w-pl-pr),y=a=>pt+(1-a/top)*(h-pt-pb);
  const line=p.map((q,i)=>(i?"L":"M")+x(q[1]).toFixed(1)+" "+y(q[2]).toFixed(1)).join(" ");const g="eg"+(++gid);
  let s=`<svg class="elev" viewBox="0 0 ${w} ${h}"${big?"":` preserveAspectRatio="none"`} role="img" aria-label="Elevation profile, highest point ${rt.top[0]} at about ${rt.top[2]} m"><defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sign);stop-opacity:.55"/><stop offset="1" style="stop-color:var(--sign);stop-opacity:.03"/></linearGradient></defs>`;
  if(big){for(let a=1000;a<top;a+=1000)s+=`<line x1="${pl}" x2="${w-pr}" y1="${y(a)}" y2="${y(a)}" style="stroke:var(--line)" stroke-dasharray="3 4"/><text x="${pl-6}" y="${y(a)+4}" text-anchor="end" style="fill:var(--muted);font:10px var(--mono)">${a/1000}k m</text>`;
    s+=`<text x="${pl}" y="${h-4}" style="fill:var(--muted);font:10px var(--mono)">0 km</text><text x="${w-pr}" y="${h-4}" text-anchor="end" style="fill:var(--muted);font:10px var(--mono)">${mk} km</text>`}
  s+=`<path d="${line} L${x(mk)} ${h-pb} L${x(0)} ${h-pb} Z" fill="url(#${g})"/><path d="${line}" fill="none" style="stroke:var(--sign)" stroke-width="${big?2.5:2}" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
  if(big){const tx=x(rt.top[1]),ty=y(rt.top[2]);s+=`<circle cx="${tx}" cy="${ty}" r="4" style="fill:var(--amber)"/><text x="${tx>w*.7?tx-8:tx+8}" y="${Math.max(ty-6,12)}" text-anchor="${tx>w*.7?"end":"start"}" style="fill:var(--ink);font:600 11px var(--body)">${esc(rt.top[0])} · ${rt.top[2].toLocaleString()} m</text>`}
  return s+"</svg>"}

document.addEventListener("click",async e=>{

  if(a==="add-rider"||a==="edit-rider"){if(dlg.open)dlg.close();

    catch(err){toast("Couldn't remove the rider. "+(err?.message||""))}return}
  if(a==="demo-on"){S.demo=true;render()}
  if(a==="demo-off"){S.demo=false;render()}

    try{if(a==="verify")await S.db.doc("verified/"+id).set({at:Date.now(),by:S.uid});else await S.db.doc("verified/"+id).delete();
      toast(a==="verify"?"Rider marked verified":"Verification removed");viewRider(id)}catch(err){toast("Couldn't change verification. "+(err?.message||""))}}
  if(a==="view")viewRider(id);

    try{await S.db.doc("rides/"+id).delete();toast("Ride cancelled")}catch(err){toast("Couldn't cancel the ride")}}

  if(e.target.id==="pf"){
    readForm();const d=S.draft;
    const bad=checkLegal();if(bad){toast(bad[1]);const el=$("#"+bad[0]);el.focus();el.scrollIntoView({block:"center"});return}
    if(!S.db||!S.uid){toast("Sign in on claude.ai to publish your profile");return}
    const x=S.vdraft;
    if(S.editId){
      const rid=S.editId;const prev=S.riders[rid];
      const mdoc={name:d.name,photo:okPhoto(d.photo)?d.photo:"",gender:d.gender,level:d.level||"Easy",area:d.area,phone:d.phone,years:Number(d.years)||0,styles:d.styles,bio:d.bio,dest:d.dest,
        bike:{make:d.bike.make,model:d.bike.model,cc:Number(d.bike.cc)||0,type:d.bike.type},dates:future([...new Set(d.dates)]),
        docs:{cnic:CNIC_RE.test(x.cnic),licence:!!x.licNo&&!!x.licExp&&x.licCat!=="Learner permit"&&!!x.licCat,reg:!!x.regNo,helmet:x.helmet,insured:x.insured,papers:x.papers},
        managed:true,addedBy:prev?.addedBy||S.uid,updatedAt:Date.now()};
      const b=$("#savebtn");b.disabled=true;b.textContent="Saving…";
      try{await S.db.doc("riders/"+rid).set(mdoc);await S.db.doc("verify/"+rid).set({...x,agree:false,updatedAt:Date.now()});
        S.riders[rid]=mdoc;toast(prev?"Rider updated":d.name+" is now listed");S.editId=null;S.editVerify=null;S.draft=null;S.vdraft=null;S.tab="riders";render();window.scrollTo({top:0})}
      catch(err){b.disabled=false;b.textContent="Save rider";toast("Couldn't save the rider. "+(err?.message||"Only admins can list riders."))}
      return}
    const doc={name:d.name,photo:okPhoto(d.photo)?d.photo:"",gender:d.gender,level:d.level||"Easy",area:d.area,phone:d.phone,years:Number(d.years)||0,styles:d.styles,bio:d.bio,dest:d.dest,
      bike:{make:d.bike.make,model:d.bike.model,cc:Number(d.bike.cc)||0,type:d.bike.type},dates:future([...new Set(d.dates)]),
      docs:{cnic:true,licence:x.licCat!=="Learner permit",reg:true,helmet:x.helmet,insured:x.insured,papers:x.papers},updatedAt:Date.now()};
    const priv={...x,updatedAt:Date.now()};
    const b=$("#savebtn");b.disabled=true;b.textContent="Saving…";
    try{await S.db.doc("verify/"+S.uid).set(priv);S.myVerify=priv;
      await S.db.doc("riders/"+S.uid).set(doc);S.riders[S.uid]=doc;S.draft=null;S.vdraft=null;toast("Profile saved. Riders can see you now.");S.tab="riders";render()}
    catch(err){b.disabled=false;b.textContent="Save changes";if(err?.code==="invalid_argument"){S.readOnly=true;renderNotice()}toast("Couldn't save. "+(err?.message||"Try again."))}
  }
  if(e.target.id==="hlf"){
    const title=$("#h-title").value.trim(),note=$("#h-note").value.trim(),type=$("#h-type").value;
    if(!title){toast("Name the place for this highlight");$("#h-title").focus();return}
    try{await S.db.collection("highlights").add({routeId:S.openRoute,type,title,note,by:S.uid,at:Date.now(),votes:[S.uid]});e.target.reset();toast("Highlight added. Thanks for helping other riders.")}
    catch(err){toast(err?.code==="quota_exceeded"?"The highlights board is full.":"Couldn't add the highlight. "+(err?.message||""))}
    return}
  if(e.target.id==="rf"){
    const v=id=>$("#"+id).value.trim();const date=v("r-date");if(!date||date<TODAY){toast("Pick a date from today on");return}
    const sel=v("r-dest");const rt=sel.startsWith("route:")?routeById(sel.slice(6)):null;const dest=rt?rt.to:sel;const inv=e.submitter?.dataset.invite;
    const ride={title:v("r-title")||(rt?rt.name:"Ride to "+dest),dest,routeId:rt?rt.id:"",date,time:v("r-time"),meet:v("r-meet"),notes:v("r-notes"),organizer:S.uid,riders:[S.uid],invited:inv?[inv]:[],createdAt:Date.now()};
    try{await S.db.collection("rides").add(ride);dlg.close();S.tab="rides";render();toast(inv?"Ride posted. Share the date with "+(allRiders()[inv]?.name||"them")+" on WhatsApp.":"Ride posted")}
    catch(err){toast(err?.code==="quota_exceeded"?"The ride board is full. Cancel old rides first.":"Couldn't post the ride. "+(err?.message||""))}
  }
});

/* ---------- live data ---------- */
render();
(async()=>{
  const use=window.claude&&window.claude.use;
  if(!use){S.loading=false;S.standalone=true;S.demo=true;render();return}
  const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
  if(!db){S.loading=false;S.error="Sign in to see and share rider profiles.";render();return}
  S.db=db;S.live=true;
  S.uid=user?await user.id():null;
  if(!S.uid)S.readOnly=true;
  if(user){const c=await user.can("data.write");if(c===false)S.readOnly=true;S.canEdit=await user.canEdit()}
  if(S.uid){try{const v=await db.doc("verify/"+S.uid).get();S.myVerify=v.exists?v.data():null;if(S.tab==="profile"&&!me()){S.vdraft=null;renderProfile()}}catch{}}
  db.collection("highlights").onSnapshot(snap=>{S.highlights=snap.docs.map(d=>({...d.data(),_id:d.id}));
    if(dlg.open&&S.openRoute&&$("#hl-list"))$("#hl-list").innerHTML=hlList(S.openRoute);if(S.tab==="routes")renderRoutes()},()=>{});
  db.collection("verified").onSnapshot(snap=>{const o={};snap.docs.forEach(d=>o[d.id]=d.data());S.verified=o;soft()},()=>{});
  const timer=setTimeout(()=>{if(S.loading){S.loading=false;S.error="The rider board can't be reached yet.";S.live=false;soft()}},10000);
  let gotR=false,gotRides=false;
  const done=()=>{if(gotR&&gotRides){clearTimeout(timer);if(S.loading){S.loading=false;S.error="";S.live=true}}};
  db.collection("riders").onSnapshot(snap=>{const o={};snap.docs.forEach(d=>o[d.id]=d.data());S.riders=o;if(!snap.metadata.fromCache){gotR=true;done()}soft()},
    err=>{clearTimeout(timer);S.loading=false;S.live=false;S.error="Couldn't load riders.";soft()});
  db.collection("rides").onSnapshot(snap=>{S.rides=snap.docs.map(d=>({...d.data(),_id:d.id}));if(!snap.metadata.fromCache){gotRides=true;done()}soft()},
    err=>{S.rides=[];gotRides=true;done();soft()});
  render();
})();
</script>
